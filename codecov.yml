# The project status is the ci-baseline block: a drop of more than 1 percentage point fails it. The coverage-gate
# step in ci.yml checks this file. The patch status stays informational; the gate governs only the project status.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "tests/**"
  - "benchmarks/**"
  - "samples/**"
  - "**/obj/**"
  - "**/*.g.cs"
